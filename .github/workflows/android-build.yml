name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout المستودع
        uses: actions/checkout@v4

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # لا حاجة لتثبيت Android SDK من الصفر؛ أجهزة GitHub تأتي به مسبقاً.
      # هذه الخطوة فقط تقبل التراخيص وتضمن توفر المنصة/أدوات البناء المطلوبة.
      - name: قبول تراخيص Android SDK وتثبيت الحزم المطلوبة
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: توليد ملفات Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: منح صلاحية التنفيذ لـ gradlew
        run: chmod +x ./gradlew

      - name: بناء APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: رفع الـ APK كناتج (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
